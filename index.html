<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাস্ক ম্যানেজার</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- হেডার -->
        <header>
            <h1>📋 টাস্ক ম্যানেজার</h1>
            <p>আজকের কাজগুলো সংগঠিত করুন</p>
        </header>

        <!-- টাস্ক ইনপুট ফর্ম -->
        <div class="task-form">
            <input type="text" id="taskInput" placeholder="নতুন টাস্ক লিখুন...">
            <input type="date" id="taskDate">
            <select id="taskCategory">
                <option value="ব্যক্তিগত">🧑 ব্যক্তিগত</option>
                <option value="অফিস">💼 অফিস</option>
                <option value="শিক্ষা">📚 শিক্ষা</option>
                <option value="স্বাস্থ্য">🏃 স্বাস্থ্য</option>
            </select>
            <button id="addTaskBtn">➕ টাস্ক যোগ করুন</button>
        </div>

        <!-- ফিল্টার ও সার্চ -->
        <div class="filter-section">
            <select id="filterCategory">
                <option value="সব">📂 সব</option>
                <option value="ব্যক্তিগত">🧑 ব্যক্তিগত</option>
                <option value="অফিস">💼 অফিস</option>
                <option value="শিক্ষা">📚 শিক্ষা</option>
                <option value="স্বাস্থ্য">🏃 স্বাস্থ্য</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 টাস্ক খুঁজুন...">
            <button id="clearAllBtn">🗑️ সব ডিলিট</button>
        </div>

        <!-- টাস্ক লিস্ট -->
        <div id="taskList" class="task-list">
            <!-- টাস্ক এখানে ডায়নামিকভাবে দেখাবে -->
        </div>

        <!-- টাস্ক কাউন্ট -->
        <div class="task-stats">
            <span>📊 মোট: <span id="totalTasks">0</span></span>
            <span>✅ সম্পন্ন: <span id="completedTasks">0</span></span>
            <span>⏳ বাকি: <span id="pendingTasks">0</span></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
