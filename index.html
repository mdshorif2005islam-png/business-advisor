<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - ChatGPT Style</title>
    <style>
        /* ChatGPT-এর ফন্ট */
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Hind+Siliguri:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', 'Sora', sans-serif;
            background: #ffffff; /* ChatGPT-এর মতো সাদা ব্যাকগ্রাউন্ড */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Layout - ChatGPT-এর মতো ফুল স্ক্রিন */
        .chat-wrapper {
            width: 100%;
            max-width: 768px; /* GPT-এর কনটেইনার width */
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05); /* সামান্য শ্যাডো */
        }

        /* Header */
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-name {
            font-size: 18px;
            font-weight: 600;
            color: #202123;
        }

        .online-status {
            font-size: 12px;
            color: #10a37f;
            background: #e6f4f1;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .header-right svg {
            width: 20px;
            height: 20px;
            fill: #202123;
            cursor: pointer;
        }

        /* Chat Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background: #ffffff;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        /* User Message Layout (ডান দিকে) */
        .message-row.user {
            justify-content: flex-end;
        }

        /* AI Message Layout (বাম দিকে) */
        .message-row.ai {
            justify-content: flex-start;
        }

        /* Avatar */
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar.ai {
            background: #10a37f;
            color: white;
            font-size: 16px;
        }

        .avatar.user {
            background: #5436da; /* ChatGPT-এর ইউজার Avatar কালার */
            color: white;
            font-size: 16px;
        }

        /* Message Bubbles */
        .message-text {
            max-width: 100%;
            font-size: 16px;
            line-height: 1.7;
            color: #374151;
            padding-top: 4px;
            white-space: pre-wrap;
        }

        .user .message-text {
            background: #f4f4f4;
            padding: 10px 15px;
            border-radius: 8px;
            color: #202123;
        }

        /* Typing Indicator (GPT-এর মতো) */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            padding-top: 5px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #10a37f;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* Input Area - ChatGPT-এর হুবহু */
        .input-area {
            background: #ffffff;
            padding: 20px 20px 30px 20px;
            border-top: 1px solid #e5e5e5;
        }

        .input-box-wrapper {
            position: relative;
            max-width: 768px;
            margin: 0 auto;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: #10a37f;
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }

        textarea {
            width: 100%;
            padding: 14px 50px 14px 15px;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            max-height: 200px;
            color: #202123;
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: #10a37f;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #0d8a6a;
        }

        /* Footer text */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            padding: 5px 0 15px 0;
        }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <!-- Header -->
    <div class="chat-header">
        <div class="header-left">
            <div class="model-name">AI Assistant</div>
            <div class="online-status">অনলাইন</div>
        </div>
        <div class="header-right">
            <!-- Chat Icon (GPT Style) -->
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 3.42-2.05 4.85-.74.85-1.57 1.5-2.4 1.85.2-.85.8-2.2 1.5-3.35.75-1.25 1.7-2.5 2.95-3.35zm-6.07 3.24c-.55 1.7-1.4 3.6-2.2 4.65-.5-.55-1-1.2-1.35-1.9-.55-1.1-.9-2.5-.9-3.9 0-.5.05-1 .15-1.5.55 1.4 1.75 2.75 3.3 2.75zm-2.4-6.55c1.25-.8 2.9-1.25 4.4-1.25 1.45 0 2.9.4 4.15 1.1-1.7 1.15-3.4 2.65-4.35 4.5-.95 1.85-1.4 3.75-1.55 5.1-.65-.6-1.35-1.4-1.7-2.4-.45-1.25-.55-2.65-.15-4.05.25-.95.7-1.85 1.45-2.55zm7.55 3.15c1.15-1.4 2.65-2.5 4.15-3.05.45.9.75 1.95.75 3.05 0 2.15-.85 4.15-2.3 5.6-.3.3-.65.55-1 .8.1-.85.2-2 .05-3.2-.15-1.35-.55-2.6-1.65-3.2zm-4.7 8.85c.65-1.35 1.1-2.75 1.35-4.15.2-1.2.35-2.5.15-3.65.6-.35 1.25-.55 1.95-.65.85-.15 1.75 0 2.5.35.3.7.45 1.5.45 2.3 0 1.3-.35 2.6-1 3.7-.3.55-.6 1.05-1 1.5-1.3 1.45-3.2 2.35-5.35 2.35-.5 0-1-.05-1.5-.15.5-.55 1.25-1.55 2.25-2.7z"/></svg>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-messages" id="chatMessages">
        <!-- Initial AI Message -->
        <div class="message-row ai">
            <div class="avatar ai">🤖</div>
            <div class="message-text">আসসালামু আলাইকুম! আমি আপনার AI সহকারী। আজকে আমি আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-box-wrapper">
            <textarea id="userInput" placeholder="Send a message..." rows="1" autofocus></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="footer-text">AI can make mistakes. Check important info.</div>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    
    // Textarea-এর উচ্চতা অটো-এডজাস্ট করা (GPT-এর মতো)
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        if(this.value === '') this.style.height = 'auto';
    });

    // Enter চাপলে সেন্ড, Shift+Enter চাপলে নতুন লাইন
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") return;

        // ১. ইউজারের মেসেজ যোগ করা (ডান দিকে, Avatar সহ)
        const userRow = document.createElement('div');
        userRow.classList.add('message-row', 'user');
        userRow.innerHTML = `
            <div class="message-text">${text}</div>
            <div class="avatar user">👤</div>
        `;
        chatMessages.appendChild(userRow);
        userInput.value = '';
        userInput.style.height = 'auto';
        scrollToBottom();

        // ২. টাইপিং ইন্ডিকেটর দেখানো (AI বাম দিকে)
        const typingRow = document.createElement('div');
        typingRow.classList.add('message-row', 'ai');
        typingRow.innerHTML = `
            <div class="avatar ai">🤖</div>
            <div class="typing-indicator" style="display:flex;">
                <span></span><span></span><span></span>
            </div>
        `;
        chatMessages.appendChild(typingRow);
        scrollToBottom();

        // ৩. কিছুক্ষণ পর AI-এর উত্তর (ChatGPT-এর মতো সিমুলেশন)
        setTimeout(() => {
            chatMessages.removeChild(typingRow); // টাইপিং ইন্ডিকেটর সরানো
            
            let reply = "আপনার প্রশ্নটি খুবই গুরুত্বপূর্ণ। আমি এটি নিয়ে বিশ্লেষণ করছি। আপনি কি আরও নির্দিষ্ট করে বলতে পারবেন কী জানতে চান?";
            
            // সাধারণ রেসপন্স লজিক
            if (text.toLowerCase().includes("ব্যবসা") || text.toLowerCase().includes("বিজনেস")) {
                reply = "ব্যবসা শুরুর জন্য সবচেয়ে গুরুত্বপূর্ণ হলো একটি ভালো আইডিয়া এবং সঠিক মার্কেট রিসার্চ। আপনি কি স্টার্টআপ শুরু করতে চান, নাকি অনলাইন বিজনেস করতে চান?";
            } else if (text.includes("হাই") || text.includes("hello") || text.includes("আসসালামু")) {
                reply = "ওয়ালাইকুম আসসালাম! আমি ভালো আছি, আপনাকে সাহায্য করতে পেরে খুশি। আপনার সমস্যা কী?";
            }

            // নতুন AI মেসেজ তৈরি করা (বাম দিকে)
            const aiRow = document.createElement('div');
            aiRow.classList.add('message-row', 'ai');
            aiRow.innerHTML = `
                <div class="avatar ai">🤖</div>
                <div class="message-text">${reply}</div>
            `;
            chatMessages.appendChild(aiRow);
            scrollToBottom();

        }, 1500); // ১.৫ সেকেন্ড পর উত্তর আসবে
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
